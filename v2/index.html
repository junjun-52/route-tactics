<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ROUTE TACTICS | ルート・タクティクス</title>
  <style>
    :root {
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --border: #e2e8f0;
      --accent: #f97316;
      --accent-hover: #ea580c;
      --accent-soft: #fff7ed;
      --accent-border: #fed7aa;
      --dark: #0f172a;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 16px 12px 48px;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
    }

    /* Header */
    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding: 4px 2px;
      gap: 12px;
      flex-wrap: wrap;
    }
    .app-title h1 {
      margin: 0;
      font-size: 22px;
      letter-spacing: 0.04em;
      color: var(--dark);
    }
    .app-title p {
      margin: 2px 0 0;
      font-size: 11px;
      color: var(--muted);
      font-weight: 600;
    }
    .profile-box {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--card);
      border: 1px solid var(--border);
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
    }

    /* Card */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.04);
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 700;
      margin: 0 0 14px;
      padding-left: 10px;
      border-left: 4px solid var(--accent);
      color: var(--dark);
    }
    .section-title span.sub {
      font-size: 12px;
      font-weight: 500;
      color: var(--muted);
    }

    /* Form */
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    @media (max-width: 480px) {
      .grid-2 { grid-template-columns: 1fr; }
    }

    .field { margin-bottom: 12px; }
    .field label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 5px;
    }

    input[type="text"],
    input[type="number"],
    input[type="date"],
    input[type="time"],
    select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 14px;
      background: #fff;
      color: var(--text);
      outline: none;
    }
    input:focus, select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.15);
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 9px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      border: 1px solid #cbd5e1;
      background: #f8fafc;
      color: var(--text);
      transition: 0.15s;
    }
    .btn:hover { background: #f1f5f9; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-block { width: 100%; }
    .btn-sm { padding: 5px 10px; font-size: 12px; }
    .btn-dark {
      background: var(--dark);
      color: #fff;
      border-color: var(--dark);
    }
    .btn-dark:hover { background: #1e293b; }
    .btn-primary {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 14px;
      font-size: 15px;
      margin-top: 8px;
    }
    .btn-primary:hover { background: var(--accent-hover); }

    /* Quick place chips */
    .chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 8px;
    }

    /* Info bar */
    .info-bar {
      background: #f8fafc;
      border-left: 3px solid var(--dark);
      padding: 8px 12px;
      font-size: 12px;
      color: var(--text);
      border-radius: 0 6px 6px 0;
      margin-top: 8px;
    }

    /* Waypoints (MAX 5) */
    .waypoint-area {
      margin: 14px 0;
    }
    .btn-add-wp {
      width: 100%;
      padding: 10px;
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      color: var(--dark);
      cursor: pointer;
    }
    .btn-add-wp:hover:not(:disabled) { background: #f1f5f9; }
    .btn-add-wp:disabled { opacity: 0.5; cursor: not-allowed; }

    .first-seg-box {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      margin-top: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      font-weight: 700;
    }
    .first-seg-box select { flex: 1; padding: 7px 10px; font-size: 13px; }

    .waypoint-card {
      background: var(--accent-soft);
      border: 1px solid var(--accent-border);
      border-radius: 10px;
      padding: 12px;
      margin-top: 10px;
    }
    .waypoint-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      font-size: 12px;
      font-weight: 700;
      color: #c2410c;
    }
    .btn-remove-wp {
      background: none;
      border: none;
      color: var(--danger);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      padding: 2px 6px;
    }
    .segment-mode-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
      font-size: 12px;
      font-weight: 700;
      color: #9a3412;
    }
    .segment-mode-row select {
      flex: 1;
      padding: 7px 10px;
      font-size: 13px;
    }

    /* Places editor */
    .places-editor {
      display: none;
      margin-top: 12px;
      padding: 12px;
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    .places-editor.open { display: block; }

    /* Results */
    #results-area { display: none; }
    .result-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }
    .result-card {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      background: #fff;
    }
    .result-card.highlight {
      border: 2px solid var(--accent);
      background: #fffaf5;
    }
    .result-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .result-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--dark);
    }
    .result-total {
      font-size: 18px;
      font-weight: 800;
      color: var(--accent-hover);
    }
    .result-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 10px;
    }
    .seg-breakdown {
      font-size: 11px;
      color: var(--muted);
      background: #f8fafc;
      padding: 8px;
      border-radius: 6px;
      margin-bottom: 10px;
    }
    .error-msg {
      color: var(--danger);
      font-size: 13px;
      font-weight: 600;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="app-header">
      <div class="app-title">
        <h1>ROUTE TACTICS</h1>
        <p>ルート・タクティクス｜TIME × TOLL OPTIMIZER</p>
      </div>
      <div class="profile-box">
        <span>👤 <span id="profile-name-label">デフォルト</span></span>
        <button type="button" class="btn btn-sm" id="btn-switch-profile">名前・切替</button>
      </div>
    </div>

    <!-- 01 / VEHICLE & PLACES -->
    <section class="card">
      <h2 class="section-title">01 / VEHICLE &amp; PLACES <span class="sub">車両・自宅・登録地設定</span></h2>
      <div class="grid-2">
        <div class="field">
          <label for="mpg">燃費 (km/L)</label>
          <input type="number" id="mpg" step="0.1" value="15.0" />
        </div>
        <div class="field">
          <label for="gas-price">ガソリン単価 (円/L)</label>
          <input type="number" id="gas-price" step="1" value="157" />
        </div>
      </div>

      <div class="field">
        <button type="button" class="btn btn-block" id="btn-toggle-places">
          📍 自宅（ホーム）・登録地（5ヶ所）を編集する
        </button>
        <div id="places-editor" class="places-editor">
          <div class="field">
            <label for="place-home">自宅（ホーム）</label>
            <input type="text" id="place-home" placeholder="例：愛知県稲沢市..." />
          </div>
          <div class="grid-2">
            <div class="field"><label>登録地 1</label><input type="text" class="saved-place-input" value="名古屋駅" /></div>
            <div class="field"><label>登録地 2</label><input type="text" class="saved-place-input" value="栄" /></div>
            <div class="field"><label>登録地 3</label><input type="text" class="saved-place-input" value="セントレア" /></div>
            <div class="field"><label>登録地 4</label><input type="text" class="saved-place-input" placeholder="任意" /></div>
            <div class="field"><label>登録地 5</label><input type="text" class="saved-place-input" placeholder="任意" /></div>
          </div>
        </div>
      </div>

      <button type="button" class="btn btn-block" id="btn-save-settings">
        このスマホ内に設定（燃費・自宅・登録地）を保存
      </button>
    </section>

    <!-- 02 / SCHEDULE & TOLL SOURCE -->
    <section class="card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
        <h2 class="section-title" style="margin:0;">02 / SCHEDULE &amp; TOLL SOURCE <span class="sub">日時・料金参照設定</span></h2>
        <button type="button" class="btn btn-sm" id="btn-now">現在日時</button>
      </div>
      <div class="field">
        <select id="time-mode">
          <option value="departure">出発時間で指定する</option>
          <option value="arrival">到着時間で指定する</option>
        </select>
      </div>
      <div class="grid-2">
        <div class="field">
          <label for="travel-date">走行日</label>
          <input type="date" id="travel-date" />
        </div>
        <div class="field">
          <label for="travel-time">時刻</label>
          <input type="time" id="travel-time" />
        </div>
      </div>
      <div class="info-bar">
        料金・時間根拠: Google Routes API（リアルタイム渋滞・ETC料金を直接参照）
      </div>
    </section>

    <!-- 03 / ROUTE TACTICS -->
    <section class="card">
      <h2 class="section-title">03 / ROUTE TACTICS <span class="sub">ルート戦略比較</span></h2>

      <!-- 出発地 -->
      <div class="field">
        <label>出発地（ボタンでワンタップ入力）</label>
        <div class="chip-row" id="origin-chips"></div>
        <input type="text" id="origin-input" placeholder="出発地を入力（または上のボタンを選択）" />
      </div>

      <!-- 経由地（MAX 5ヶ所） -->
      <div class="waypoint-area">
        <button type="button" id="add-waypoint-btn" class="btn-add-wp">
          ＋ 経由地・乗降ICを追加（残り5ヶ所）
        </button>
        <div id="waypoints-container"></div>
      </div>

      <!-- 目的地 -->
      <div class="field">
        <label>目的地（ボタンでワンタップ入力）</label>
        <div class="chip-row" id="dest-chips"></div>
        <input type="text" id="dest-input" placeholder="目的地を入力（施設名・住所・駅名など）" />
      </div>

      <button type="button" class="btn btn-primary btn-block" id="btn-run">
        ルート・コスト比較を実行
      </button>
      <div id="error-box" class="error-msg"></div>
    </section>

    <!-- Results -->
    <section class="card" id="results-area">
      <h2 class="section-title">04 / COMPARISON RESULT <span class="sub">比較結果</span></h2>
      <div id="results-list" class="result-grid"></div>
    </section>
  </div>

  <script>
    // =========================================================================
    // ★設定：Google Routes APIキーをここに設定してください
    // =========================================================================
    const GOOGLE_API_KEY = "YOUR_GOOGLE_MAPS_API_KEY";

    const MAX_WAYPOINTS = 5;
    let currentProfile = localStorage.getItem("rt_current_profile") || "デフォルト";
    let waypoints = []; // { name: string, modeAfter: "highway" | "local" }
    let firstSegmentMode = "highway"; // 出発地 -> 経由地1 のモード

    // DOM参照
    const profileLabel = document.getElementById("profile-name-label");
    const mpgEl = document.getElementById("mpg");
    const gasPriceEl = document.getElementById("gas-price");
    const homeEl = document.getElementById("place-home");
    const savedPlaceInputs = document.querySelectorAll(".saved-place-input");
    const originChips = document.getElementById("origin-chips");
    const destChips = document.getElementById("dest-chips");
    const originInput = document.getElementById("origin-input");
    const destInput = document.getElementById("dest-input");
    const addWpBtn = document.getElementById("add-waypoint-btn");
    const wpContainer = document.getElementById("waypoints-container");
    const dateEl = document.getElementById("travel-date");
    const timeEl = document.getElementById("travel-time");
    const errorBox = document.getElementById("error-box");
    const resultsArea = document.getElementById("results-area");
    const resultsList = document.getElementById("results-list");

    // 初期化
    setNowDateTime();
    loadProfileSettings();
    renderWaypoints();

    // 現在日時セット
    function setNowDateTime() {
      const now = new Date();
      const yyyy = now.getFullYear();
      const mm = String(now.getMonth() + 1).padStart(2, "0");
      const dd = String(now.getDate()).padStart(2, "0");
      const hh = String(now.getHours()).padStart(2, "0");
      const mi = String(now.getMinutes()).padStart(2, "0");
      dateEl.value = `${yyyy}-${mm}-${dd}`;
      timeEl.value = `${hh}:${mi}`;
    }
    document.getElementById("btn-now").addEventListener("click", setNowDateTime);

    // 登録地編集トグル
    document.getElementById("btn-toggle-places").addEventListener("click", () => {
      document.getElementById("places-editor").classList.toggle("open");
    });

    // プロファイル切替
    document.getElementById("btn-switch-profile").addEventListener("click", () => {
      const name = prompt("プロファイル名を入力してください（新規作成・切替）", currentProfile);
      if (!name || !name.trim()) return;
      currentProfile = name.trim();
      localStorage.setItem("rt_current_profile", currentProfile);
      loadProfileSettings();
    });

    // 設定保存・読込
    function getStorageKey() {
      return `rt_settings_${currentProfile}`;
    }

    function loadProfileSettings() {
      profileLabel.textContent = currentProfile;
      const raw = localStorage.getItem(getStorageKey());
      if (raw) {
        const data = JSON.parse(raw);
        mpgEl.value = data.mpg ?? 15.0;
        gasPriceEl.value = data.gasPrice ?? 157;
        homeEl.value = data.home ?? "";
        const places = data.places || ["名古屋駅", "栄", "セントレア", "", ""];
        savedPlaceInputs.forEach((el, i) => { el.value = places[i] || ""; });
      }
      renderPlaceChips();
    }

    document.getElementById("btn-save-settings").addEventListener("click", () => {
      const places = Array.from(savedPlaceInputs).map(el => el.value.trim());
      const payload = {
        mpg: parseFloat(mpgEl.value) || 15.0,
        gasPrice: parseFloat(gasPriceEl.value) || 157,
        home: homeEl.value.trim(),
        places
      };
      localStorage.setItem(getStorageKey(), JSON.stringify(payload));
      renderPlaceChips();
      alert(`プロファイル「${currentProfile}」の設定を保存しました。`);
    });

    // ワンタップボタン描画
    function renderPlaceChips() {
      originChips.innerHTML = "";
      destChips.innerHTML = "";

      // 現在地ボタン（出発地のみ）
      const gpsBtn = document.createElement("button");
      gpsBtn.type = "button";
      gpsBtn.className = "btn btn-sm btn-dark";
      gpsBtn.textContent = "📍 現在地";
      gpsBtn.addEventListener("click", () => {
        if (!navigator.geolocation) {
          alert("位置情報が利用できません。");
          return;
        }
        gpsBtn.textContent = "取得中...";
        navigator.geolocation.getCurrentPosition(
          pos => {
            originInput.value = `${pos.coords.latitude.toFixed(6)},${pos.coords.longitude.toFixed(6)}`;
            gpsBtn.textContent = "📍 現在地";
          },
          () => {
            alert("現在地の取得に失敗しました。");
            gpsBtn.textContent = "📍 現在地";
          }
        );
      });
      originChips.appendChild(gpsBtn);

      const list = [];
      if (homeEl.value.trim()) list.push({ label: "🏠 自宅", value: homeEl.value.trim() });
      savedPlaceInputs.forEach(el => {
        const v = el.value.trim();
        if (v) list.push({ label: v, value: v });
      });

      list.forEach(item => {
        const b1 = document.createElement("button");
        b1.type = "button";
        b1.className = "btn btn-sm";
        b1.textContent = item.label;
        b1.onclick = () => { originInput.value = item.value; };
        originChips.appendChild(b1);

        const b2 = document.createElement("button");
        b2.type = "button";
        b2.className = "btn btn-sm";
        b2.textContent = item.label;
        b2.onclick = () => { destInput.value = item.value; };
        destChips.appendChild(b2);
      });
    }

    // =========================================================================
    // 経由地（MAX 5ヶ所）UI制御
    // =========================================================================
    addWpBtn.addEventListener("click", () => {
      if (waypoints.length >= MAX_WAYPOINTS) return;
      waypoints.push({ name: "", modeAfter: "local" });
      renderWaypoints();
    });

    function renderWaypoints() {
      wpContainer.innerHTML = "";

      if (waypoints.length > 0) {
        const firstBox = document.createElement("div");
        firstBox.className = "first-seg-box";
        firstBox.innerHTML = `
          <span>出発地 ➔ 経由地1</span>
          <select id="first-seg-select">
            <option value="highway" ${firstSegmentMode === "highway" ? "selected" : ""}>【高速】を利用</option>
            <option value="local" ${firstSegmentMode === "local" ? "selected" : ""}>【下道】のみ</option>
          </select>
        `;
        wpContainer.appendChild(firstBox);
        firstBox.querySelector("select").addEventListener("change", e => {
          firstSegmentMode = e.target.value;
        });
      }

      waypoints.forEach((wp, idx) => {
        const nextLabel = idx === waypoints.length - 1 ? "目的地" : `経由地${idx + 2}`;
        const card = document.createElement("div");
        card.className = "waypoint-card";
        card.innerHTML = `
          <div class="waypoint-header">
            <span>経由地 ${idx + 1} / 乗り降りするIC名</span>
            <button type="button" class="btn-remove-wp" data-idx="${idx}">✕ 削除</button>
          </div>
          <input
            type="text"
            class="wp-name-input"
            data-idx="${idx}"
            value="${escapeHtml(wp.name)}"
            placeholder="例：経由するIC名や地名を入力"
          />
          <div class="segment-mode-row">
            <span>経由地${idx + 1} ➔ ${nextLabel}</span>
            <select class="wp-mode-select" data-idx="${idx}">
              <option value="highway" ${wp.modeAfter === "highway" ? "selected" : ""}>【高速】を利用</option>
              <option value="local" ${wp.modeAfter === "local" ? "selected" : ""}>【下道】のみ</option>
            </select>
          </div>
        `;
        wpContainer.appendChild(card);
      });

      // イベント紐付け
      wpContainer.querySelectorAll(".btn-remove-wp").forEach(btn => {
        btn.addEventListener("click", e => {
          const i = Number(e.target.dataset.idx);
          waypoints.splice(i, 1);
          renderWaypoints();
        });
      });
      wpContainer.querySelectorAll(".wp-name-input").forEach(input => {
        input.addEventListener("input", e => {
          const i = Number(e.target.dataset.idx);
          waypoints[i].name = e.target.value;
        });
      });
      wpContainer.querySelectorAll(".wp-mode-select").forEach(sel => {
        sel.addEventListener("change", e => {
          const i = Number(e.target.dataset.idx);
          waypoints[i].modeAfter = e.target.value;
        });
      });

      const remaining = MAX_WAYPOINTS - waypoints.length;
      addWpBtn.disabled = remaining <= 0;
      addWpBtn.textContent = remaining > 0
        ? `＋ 経由地・乗降ICを追加（残り${remaining}ヶ所）`
        : `経由地は最大${MAX_WAYPOINTS}ヶ所までです`;
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, m => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[m]));
    }

    // =========================================================================
    // Google Routes API 呼び出し & 比較実行
    // =========================================================================
    async function fetchRouteSegment(origin, destination, mode) {
      const url = "https://routes.googleapis.com/directions/v2:computeRoutes";
      const body = {
        origin: { address: origin },
        destination: { address: destination },
        travelMode: "DRIVE",
        routingPreference: "TRAFFIC_AWARE",
        extraComputations: ["TOLLS"],
        routeModifiers: {
          avoidTolls: mode === "local",
          avoidHighways: mode === "local"
        },
        languageCode: "ja"
      };

      const res = await fetch(url, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-Goog-Api-Key": GOOGLE_API_KEY,
          "X-Goog-FieldMask": "routes.duration,routes.distanceMeters,routes.travelAdvisory.tollInfo"
        },
        body: JSON.stringify(body)
      });

      if (!res.ok) {
        const errText = await res.text();
        throw new Error(`APIエラー (${res.status}): ${errText}`);
      }
      const data = await res.json();
      if (!data.routes || data.routes.length === 0) {
        throw new Error(`ルートが見つかりませんでした（${origin} → ${destination}）`);
      }

      const route = data.routes[0];
      const distanceKm = (route.distanceMeters || 0) / 1000;
      const durationSec = parseInt((route.duration || "0s").replace("s", ""), 10);
      let tollYen = 0;
      const tolls = route.travelAdvisory?.tollInfo?.estimatedPrice || [];
      if (tolls.length > 0) {
        tollYen = parseInt(tolls[0].units || "0", 10);
      }

      return { origin, destination, mode, distanceKm, durationSec, tollYen };
    }

    function calcFuelCost(distanceKm) {
      const mpg = parseFloat(mpgEl.value) || 15.0;
      const gas = parseFloat(gasPriceEl.value) || 157;
      return Math.round((distanceKm / mpg) * gas);
    }

    function formatDuration(sec) {
      const h = Math.floor(sec / 3600);
      const m = Math.round((sec % 3600) / 60);
      return h > 0 ? `${h}時間${m}分` : `${m}分`;
    }

    function buildGoogleMapsUrl(origin, destination, wpNames, avoidHighways) {
      const params = new URLSearchParams({
        api: "1",
        origin,
        destination,
        travelmode: "driving"
      });
      if (wpNames.length > 0) {
        params.set("waypoints", wpNames.join("|"));
      }
      if (avoidHighways) {
        params.set("avoid", "highways,tolls");
      }
      return `https://www.google.com/maps/dir/?${params.toString()}`;
    }

    document.getElementById("btn-run").addEventListener("click", async () => {
      errorBox.textContent = "";
      const origin = originInput.value.trim();
      const dest = destInput.value.trim();

      if (!origin || !dest) {
        errorBox.textContent = "出発地と目的地を入力してください。";
        return;
      }
      if (!GOOGLE_API_KEY || GOOGLE_API_KEY === "YOUR_GOOGLE_MAPS_API_KEY") {
        errorBox.textContent = "コード内の GOOGLE_API_KEY をご自身のAPIキーに書き換えてください。";
        return;
      }

      const runBtn = document.getElementById("btn-run");
      runBtn.disabled = true;
      runBtn.textContent = "ルート計算中...";

      try {
        const validWps = waypoints.filter(w => w.name.trim() !== "");
        const tasks = [
          fetchRouteSegment(origin, dest, "highway"),
          fetchRouteSegment(origin, dest, "local")
        ];

        // 経由地がある場合はカスタム区間を並列計算
        let customSegmentsDef = [];
        if (validWps.length > 0) {
          customSegmentsDef.push({ from: origin, to: validWps[0].name.trim(), mode: firstSegmentMode });
          for (let i = 0; i < validWps.length; i++) {
            const to = (i === validWps.length - 1) ? dest : validWps[i + 1].name.trim();
            customSegmentsDef.push({ from: validWps[i].name.trim(), to, mode: validWps[i].modeAfter });
          }
        }

        const [hwRes, localRes] = await Promise.all(tasks);
        let customResList = [];
        if (customSegmentsDef.length > 0) {
          customResList = await Promise.all(
            customSegmentsDef.map(s => fetchRouteSegment(s.from, s.to, s.mode))
          );
        }

        renderResults(origin, dest, hwRes, localRes, customResList, validWps.map(w => w.name.trim()));
      } catch (err) {
        errorBox.textContent = err.message;
      } finally {
        runBtn.disabled = false;
        runBtn.textContent = "ルート・コスト比較を実行";
      }
    });

    function renderResults(origin, dest, hw, local, customList, wpNames) {
      resultsList.innerHTML = "";
      resultsArea.style.display = "block";

      const cards = [];

      // 1. カスタム経由ルート（経由地ありの場合）
      if (customList.length > 0) {
        const dist = customList.reduce((a, b) => a + b.distanceKm, 0);
        const dur = customList.reduce((a, b) => a + b.durationSec, 0);
        const toll = customList.reduce((a, b) => a + b.tollYen, 0);
        const fuel = calcFuelCost(dist);
        const breakdown = customList.map((s, i) =>
          `区間${i + 1} [${s.mode === "highway" ? "高速" : "下道"}]: ${s.origin} → ${s.destination}（${s.distanceKm.toFixed(1)}km / ${formatDuration(s.durationSec)} / 料金¥${s.tollYen.toLocaleString()}）`
        ).join("<br>");

        cards.push({
          title: `⭐ カスタム経由ルート（経由地${wpNames.length}ヶ所）`,
          highlight: true,
          dist, dur, toll, fuel,
          breakdown,
          mapUrl: buildGoogleMapsUrl(origin, dest, wpNames, false)
        });
      }

      // 2. 全高速ルート
      cards.push({
        title: "🛣️ 全区間【高速】ルート",
        highlight: false,
        dist: hw.distanceKm,
        dur: hw.durationSec,
        toll: hw.tollYen,
        fuel: calcFuelCost(hw.distanceKm),
        breakdown: "",
        mapUrl: buildGoogleMapsUrl(origin, dest, [], false)
      });

      // 3. 全下道ルート
      cards.push({
        title: "🚗 全区間【下道】ルート",
        highlight: false,
        dist: local.distanceKm,
        dur: local.durationSec,
        toll: 0,
        fuel: calcFuelCost(local.distanceKm),
        breakdown: "",
        mapUrl: buildGoogleMapsUrl(origin, dest, [], true)
      });

      cards.forEach(c => {
        const total = c.toll + c.fuel;
        const div = document.createElement("div");
        div.className = `result-card ${c.highlight ? "highlight" : ""}`;
        div.innerHTML = `
          <div class="result-head">
            <div class="result-title">${c.title}</div>
            <div class="result-total">¥${total.toLocaleString()}</div>
          </div>
          <div class="result-meta">
            <span>⏱ ${formatDuration(c.dur)}</span>
            <span>📏 ${c.dist.toFixed(1)} km</span>
            <span>🎫 高速 ¥${c.toll.toLocaleString()}</span>
            <span>⛽ 燃料 ¥${c.fuel.toLocaleString()}</span>
          </div>
          ${c.breakdown ? `<div class="seg-breakdown">${c.breakdown}</div>` : ""}
          <a href="${c.mapUrl}" target="_blank" rel="noopener" class="btn btn-sm btn-dark" style="text-decoration:none;">
            🗺️ Googleマップで開く（CarPlay引き継ぎ）
          </a>
        `;
        resultsList.appendChild(div);
      });

      resultsArea.scrollIntoView({ behavior: "smooth" });
    }
  </script>
</body>
</html>
